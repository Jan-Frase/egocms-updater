name: Basic CI
on: [ push, pull_request ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          override: true

      - name: Is the formatter happy?
        run: cargo fmt -- --check

      - name: Is Clippy happy?
        run: cargo clippy

      - name: Build!
        run: cargo build

      - name: Run tests :)
        run: cargo test

      - name: Update page!
        with:
          user_id: ${{secrets.USER_ID}}
          user_token: ${{secrets.USER_TOKEN}}
        run: cargo run --release -- ./config/config.toml